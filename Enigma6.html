<!DOCTYPE html>
<html lang="pt-br">

	<head>
		<meta charset="utf-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">

				<meta name="author" content="adachi">
					<meta name="description" content="Bodhi">
						<meta name="google" content="notranslate">

							<title>Ouça</title>
							

							<style>

								body {
								background-color: black;
								background-size: 1920px 1080px;
								text-align: center;
								color: white;
								}

								input {
								padding: 10px;
								font-size: 18px;
								}

								button {
								padding: 10px;
								font-size: 18px;
								cursor: pointer;
								}

								#resultado {
								margin-top: 20px;
								font-size: 25px;
								}

								.resposta-area {
								position: absolute;
								bottom: 30px;
								left: 50%;
								transform: translateX(-50%);
								}

								.morsecode6 {
								position: fixed;
								width: 80%;
								max-width: 500px;
								top: 50%;
								left: 50%;
								transform: translate(-50%, -50%);
								}

							</style>
						</head>

	<body>

		<!-- ÁUDIO -->

		<audio class="morsecode6" controls="">
			<source src="morsecode6.wav" type="audio/wav">
		</audio>


		<!-- ÁREA DA RESPOSTA -->

		<div class="resposta-area">

			<input
				type="text"
				id="resposta"
				data-pt-placeholder="Digite sua resposta"
				data-en-placeholder="Enter your answer"
				placeholder="Digite sua resposta"
				onkeydown="teclaEnter(event)"
			>

				<button
					id="botao"
					data-pt="Responder"
					data-en="Answer"
					onclick="verificar()">
					Responder
				</button>

				<p id="resultado"></p>

			</div>


		<script>

			<!-- IDIOMA ESCOLHIDO NO LOCALSTORAGE -->

			let idioma = localStorage.getItem("idioma");

			if (!idioma) {
			idioma = "pt";
			}


			<!-- NOME DA ABA DE ACORDO COM O IDIOMA -->

			if (idioma === "pt") {

			document.title = "Ouça";

			} else {

			document.title = "Listen";

			}


			<!-- APLICAR IDIOMA -->

			mudarIdioma(idioma);


			function mudarIdioma(idioma) {

			<!-- ALTERAR TODOS OS TEXTOS -->

			document.querySelectorAll("[data-pt]").forEach(function(elemento) {

			elemento.innerHTML =
			elemento.getAttribute("data-" + idioma);

			});


			<!-- ALTERAR PLACEHOLDER -->

			let input = document.getElementById("resposta");

			input.placeholder =
			input.getAttribute("data-" + idioma + "-placeholder");


			<!-- ALTERAR IDIOMA DA PÁGINA -->

			document.documentElement.lang =
			idioma === "pt" ? "pt-br" : "en";


			<!-- SALVAR IDIOMA -->

			localStorage.setItem("idioma", idioma);

			}


			<!-- VERIFICAR SE AS FASES ANTERIORES FORAM CONCLUÍDAS -->

			if (
			localStorage.getItem("Enigma1") !== "resolvido" ||
			localStorage.getItem("Enigma2") !== "resolvido" ||
			localStorage.getItem("Enigma3") !== "resolvido" ||
			localStorage.getItem("Enigma4") !== "resolvido" ||
			localStorage.getItem("Enigma5") !== "resolvido"
			) {

			window.location.href = "Enigma1.html";

			}


			<!-- VERIFICAR RESPOSTA -->

			function verificar() {

			let resposta = document.getElementById("resposta")
			.value
			.toLowerCase()
			.trim()
			.normalize("NFD")
			.replace(/[\u0300-\u036f]/g, "")
			.replace(/[-\s]/g, "")
			.replace(/\s+/g, "");


			<!-- RESPOSTA CORRETA -->

			if (resposta === "ghaeslio") {

			localStorage.setItem("Enigma6", "resolvido");

			window.location.href = "Enigma7.html";


			<!-- PRIMEIRA DICA -->

			} else if (resposta === "morse") {

			if (idioma === "pt") {

			document.getElementById("resultado").innerHTML =
			"É isso mesmo.";

			} else {

			document.getElementById("resultado").innerHTML =
			"That's right.";

			}


			<!-- SEGUNDA DICA -->

			} else if (resposta === "codigomorse") {

			if (idioma === "pt") {

			document.getElementById("resultado").innerHTML =
			"Sim, é código Morse mesmo.";

			} else {

			document.getElementById("resultado").innerHTML =
			"Yes, it is Morse code.";

			}


			<!-- RESPOSTA ERRADA -->

			} else {

			document.getElementById("resultado").innerHTML =
			".-";

			}

			}


			<!-- ENTER -->

			function teclaEnter(event) {

			if (event.key === "Enter") {

			verificar();

			}

			}

		</script>

	</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">

	<head>
		<meta charset="utf-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<meta http-equiv="X-UA-Compatible" content="IE=edge">
					<meta name="author" content="adachi">
						<meta name="description" content="Desde o primeiro dia, porém,">

							<title>F = G * m1*m2/d2</title>

							<style>
								body {
								background-color: black;
								background-size: 1920px 1080px;
								text-align: center;
								color: white;
								}

								input {
								padding: 10px;
								font-size: 18px;
								}

								button {
								padding: 10px;
								font-size: 18px;
								cursor: pointer;
								}

								#resultado {
								margin-top: 20px;
								font-size: 25px;
								}

								.resposta-area {
								position: absolute;
								bottom: 30px;
								left: 50%;
								transform: translateX(-50%);
								}

								.maca {
								position: fixed;
								left: 50%;
								top: 100px;

								transform: translateX(-50%);

								font-size: 80px;
								animation: cair 3s ease-in-out infinite;
								z-index: 10;
								}

								@keyframes cair {

								0% {
								top: -100px;
								transform: translateX(-50%);
								}

								75% {
								top: calc(100vh - 210px);
								}

								100% {
								top: calc(100vh - 210px);
								}

								}
							</style>
						</head>

	<body>

		<div class="maca">🍎</div>

		<p
			id="frase"
			data-pt="A aceleração de um corpo depende da força aplicada e da sua massa."
			data-en="The acceleration of a body depends on the force applied to it and its mass."
			style="font-size:30px">
		</p>

		<div class="resposta-area">

			<input
				type="text"
				id="resposta"
				data-pt-placeholder="Digite sua resposta"
				data-en-placeholder="Enter your answer"
				placeholder="Digite sua resposta"
				onkeydown="teclaEnter(event)"
			>

				<button
					id="botao"
					data-pt="Responder"
					data-en="Answer"
					onclick="verificar()">
					Responder
				</button>

				<p id="resultado"></p>

			</div>

		<script>

			<!-- IDIOMA ESCOLHIDO NO ENIGMA 1 -->

			let idioma = localStorage.getItem("idioma");

			if (!idioma) {
			idioma = "pt";
			}


			<!-- NOME DA ABA DE ACORDO COM O IDIOMA -->

			if (idioma === "pt") {

			document.title =
			"F = G * m1*m2/d2";

			} else {

			document.title =
			"F = G * m1*m2/d2";

			}


			<!-- APLICAR IDIOMA -->

			document.querySelectorAll("[data-pt]").forEach(function(elemento) {

			elemento.innerHTML =
			elemento.getAttribute("data-" + idioma);

			});


			<!-- ALTERAR PLACEHOLDER -->

			let input = document.getElementById("resposta");

			input.placeholder =
			input.getAttribute("data-" + idioma + "-placeholder");


			<!-- DEFINIR IDIOMA DA PÁGINA -->

			document.documentElement.lang =
			idioma === "pt" ? "pt-br" : "en";


			<!-- VERIFICAR SE AS FASES ANTERIORES FORAM CONCLUÍDAS -->

			if (
			localStorage.getItem("Enigma1") !== "resolvido" ||
			localStorage.getItem("Enigma2") !== "resolvido" ||
			localStorage.getItem("Enigma3") !== "resolvido" ||
			localStorage.getItem("Enigma4") !== "resolvido" ||
			localStorage.getItem("Enigma5") !== "resolvido" ||
			localStorage.getItem("Enigma6") !== "resolvido"
			) {

			window.location.href = "Enigma1.html";

			}


			<!-- VERIFICAR RESPOSTA -->

			function verificar() {

			let resposta = document.getElementById("resposta")
			.value
			.toLowerCase()
			.trim()
			.normalize("NFD")
			.replace(/[\u0300-\u036f]/g, "")
			.replace(/[-\s]/g, "")
			.replace(/\s+/g, "");


			<!-- RESPOSTA CORRETA -->

			if (resposta === "gravidade" || resposta === "gravity") {

			localStorage.setItem("Enigma7", "resolvido");

			window.location.href = "Enigma8.html";


			<!-- PRIMEIRA DICA -->

			} else if (resposta === "newton") {

			if (idioma === "pt") {

			document.getElementById("resultado").innerHTML =
			"Está no caminho.";

			} else {

			document.getElementById("resultado").innerHTML =
			"You're on the right path.";

			}


			<!-- SEGUNDA DICA -->

			} else if (resposta === "maca" || resposta === "apple") {

			if (idioma === "pt") {

			document.getElementById("resultado").innerHTML =
			"Sério?";

			} else {

			document.getElementById("resultado").innerHTML =
			"Seriously?";

			}


			<!-- RESPOSTA ERRADA -->

			} else {

			if (idioma === "pt") {

			document.getElementById("resultado").innerHTML =
			"Deformação do espaço-tempo.";

			} else {

			document.getElementById("resultado").innerHTML =
			"Spacetime distortion.";

			}

			}

			}


			<!-- ENTER -->

			function teclaEnter(event) {

			if (event.key === "Enter") {

			verificar();

			}

			}

		</script>

	</body>

</html>

	<head>
		<meta charset="utf-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<meta http-equiv="X-UA-Compatible" content="IE=edge">
					<meta name="author" content="adachi">
						<meta name="description" content="o significado da vida,">
							<meta name="google" content="notranslate">
							<title>Só existem dois caminhos.</title>
							

							<style>
								body {
									background-color: black;
									text-align: center;
									color: white;
									}

								.imagem {
								position: absolute;
								width: 80%;
								max-width: 1200px;
								top: 40%;
								left: 50%;
								transform: translate(-50%, -50%);
								text-align: center;
								color: white;}



								

									input {
									padding: 10px;
									font-size: 18px;
									}

									button {
									padding: 10px;
									font-size: 18px;
									cursor: pointer;
									}

									#resultado {
									margin-top: 20px;
									font-size: 25px;
									}

									.resposta-area {
									position: absolute;
									bottom: 30px;
									left: 50%;
									transform: translateX(-50%);
									}

							</style>
						</head>

	<body>
		<img src="bi4.PNG" class="imagem">


		<div class="resposta-area">

			<input
				type="text"
				id="resposta"
				data-pt-placeholder="Digite sua resposta"
				data-en-placeholder="Enter your answer"
				placeholder="Digite sua resposta"
				onkeydown="teclaEnter(event)"
			>

				<button
						id="botao"
						data-pt="Responder"
						data-en="Answer"
						onclick="verificar()">
				</button>

				<p id="resultado"></p>

			</div>

		<script>

			if (localStorage.getItem("Enigma1") !== "resolvido" ||
			localStorage.getItem("Enigma2") !== "resolvido" ||
			localStorage.getItem("Enigma3") !== "resolvido"
			){
			window.location.href = "Enigma1.html";
			}
			<!--IDIOMA ESCOLHIDO NO ENIGMA 1-->

			let idioma = localStorage.getItem("idioma");
			if (!idioma) {
			idioma = "pt";
			}
			<!--NOME DA ABA DE ACORDO COM O IDIOMA-->

			if (idioma === "pt") {
			document.title =
			"Só existem dois caminhos.";
			}
			else {
			document.title =
			"There are only two paths.";
			}
			<!--APLICAR IDIOMA-->

			document.querySelectorAll("[data-pt]").forEach(function(elemento) {
			elemento.innerHTML =
			elemento.getAttribute("data-" + idioma);
			});

<!--DEFINIR IDIOMA DA PÁGINA-->

		document.documentElement.lang =
		idioma === "pt" ? "pt-br" : "en";

		<!--VERIFICAR RESPOSTA-->

		function verificar() {
		let resposta = document.getElementById("resposta")
		.value
		.toLowerCase()
		.trim()
		.normalize("NFD")
		.replace(/[\u0300-\u036f]/g, "")
		.replace(/[-\s]/g, "")
		.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");
<!--RESPOSTA CORRETA-->
			if (
			resposta === "cuidado" ||
			resposta === "careful"
			) {localStorage.setItem("Enigma4", "resolvido");

			window.location.href = "Enigma5.html";

			}


			else if (
			resposta === "binario" ||
			resposta === "binary"
			) {

			if (idioma === "pt") {

			document.getElementById("resultado").innerHTML =
			"Sim, é isso!";

			} else {

			document.getElementById("resultado").innerHTML =
			"Yes, that's it!";

			}

			}
			else {

			if (idioma === "pt") {

			document.getElementById("resultado").innerHTML =
			"Sem dica dessa vez!";

			} else {

			document.getElementById("resultado").innerHTML =
			"No hints this time!";

			}

			}

			} function teclaEnter(event) {

			if (event.key === "Enter") {
			verificar();
			}

			}
		</script>

	</body>

</html>

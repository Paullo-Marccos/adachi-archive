<!DOCTYPE html>
<html lang="pt-br" translate="no">

	<head>

		<meta charset="utf-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">

				<meta name="author" content="adachi">
					<meta name="description" content="há muito tempo, em uma terra">
						<meta name="google" content="notranslate">

							<title>céu</title>

							<style>

								body {
								background-color: black;
								background-size: 1920px 1080px;
								text-align: center;
								color: white;
								}

								input {
								padding: 10px;
								font-size: 18px;
								}

								button {
								padding: 10px;
								font-size: 18px;
								cursor: pointer;
								}

								#resultado {
								margin-top: 20px;
								font-size: 25px;
								}

								.resposta-area {
								position: absolute;
								bottom: 30px;
								left: 50%;
								transform: translateX(-50%);
								}

							</style>

						</head>

	<body>

		<h1
			id="titulo"
			data-pt="estrelas"
			data-en="stars">
		</h1>


		<div class="resposta-area">

			<input
				type="text"
				id="resposta"
				data-pt-placeholder="Digite sua resposta"
				data-en-placeholder="Enter your answer"
				placeholder="Digite sua resposta"
				onkeydown="teclaEnter(event)"
			>

				<button
					id="botao"
					data-pt="Responder"
					data-en="Answer"
					onclick="verificar()">
				</button>

				<p id="resultado"></p>

			</div>


		<script>


			<!--PROTEÇÃO DO ENIGMA 2-->

			if (localStorage.getItem("Enigma1") !== "resolvido") {
			window.location.href = "Enigma1.html";
			}

			<!--IDIOMA ESCOLHIDO NO ENIGMA 1-->

			let idioma = localStorage.getItem("idioma");
			if (!idioma) {
			idioma = "pt";
			}

			<!--NOME DA ABA DE ACORDO COM O IDIOMA-->

			if (idioma === "pt") {
			document.title = "céu";
			} 
			
			else {
			document.title = "sky";
			}

			<!--APLICAR IDIOMA-->

			document.querySelectorAll("[data-pt]").forEach(function(elemento) {
			elemento.innerHTML =
			elemento.getAttribute("data-" + idioma);
			});

			<!--ALTERAR PLACEHOLDER-->

			let input = document.getElementById("resposta");
			input.placeholder =
			input.getAttribute("data-" + idioma + "-placeholder");

			<!--DEFINIR IDIOMA DA PÁGINA-->

			document.documentElement.lang =
			idioma === "pt" ? "pt-br" : "en";

			<!--VERIFICAR RESPOSTA-->

			function verificar() {
			let resposta = document.getElementById("resposta")
			.value
			.toLowerCase()
			.trim()
			.normalize("NFD")
			.replace(/[\u0300-\u036f]/g, "")
			.replace(/[-\s]/g, "")
			.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");

			<!--RESPOSTA CORRETA-->

			if (
			resposta === "constelacoes" ||
			resposta === "constellations"
			) {
			localStorage.setItem("Enigma2", "resolvido");
			window.location.href = "Enigma3.html";
			}

			<!--RESPOSTA QUASE CERTA-->

			else if (
			resposta === "constelacao" ||
			resposta === "constellation"
			) {

			if (idioma === "pt") {

			document.getElementById("resultado").innerHTML =
			"São várias.";
			} 
			
			else {
			document.getElementById("resultado").innerHTML =
			"There are several.";
			}
			}

			<!--OUTRAS RESPOSTAS-->

			else {
			if (idioma === "pt") {
			document.getElementById("resultado").innerHTML =
			"Órion, Cruzeiro do Sul, Alnitak, Alnilam e Mintaka";
			} 
			
			else {
			document.getElementById("resultado").innerHTML =
			"Orion, Southern Cross, Alnitak, Alnilam and Mintaka";
			}
			}
			}

			<!--ENTER PARA RESPONDER-->

			function teclaEnter(event) {
			if (event.key === "Enter") {
			verificar();
			}
			}

		</script>

	</body>

</html>
